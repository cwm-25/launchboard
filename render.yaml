services:
  - type: web
    name: launchboard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./launchboard.db
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
